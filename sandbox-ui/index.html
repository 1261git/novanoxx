<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaNoxX 격리 구매 테스트</title>
<style>
:root{color-scheme:dark;font-family:'Space Grotesk','Malgun Gothic',sans-serif;background:#0b0c10;color:#f5f3f8}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #33343e}a{color:#ff6b2b}strong.logo{font-size:25px;letter-spacing:-1px}.badge{display:inline-block;background:#ff6b2b;color:#111;padding:6px 10px;border-radius:5px;font-size:12px;font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;margin-bottom:10px}h2{font-size:24px}p{line-height:1.7;color:#9797a8}.notice{border-left:3px solid #ff6b2b;padding:0 18px}.toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:30px 0}.balance{font-size:24px;color:#ff6b2b}select,button{font:inherit;border-radius:7px;padding:12px 16px}select{background:#20212a;color:white;border:1px solid #484957}button{cursor:pointer;background:#ff6b2b;color:#111;border:0;font-weight:bold}button:disabled{background:#383b42;color:#9ea0aa;cursor:default}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.order{background:#14141b;border:1px solid #ffffff12;border-radius:12px;padding:22px}.art{height:110px;display:grid;place-items:center;background:linear-gradient(130deg,#492362,#17131d);border-radius:7px;font-size:28px;letter-spacing:4px;color:#d3bde1}.card h3{font-size:19px}.card small,.order small{color:#9797a8}.card button{width:100%;margin-top:16px}.price{font-size:23px;margin-top:18px}.order{margin:14px 0}.order-head{display:flex;justify-content:space-between;gap:15px}.order a{display:inline-block;margin:12px 16px 0 0}.mono{font-size:12px;overflow-wrap:anywhere;color:#999baa}.status{min-height:26px;margin:14px 0;color:#ff6b2b}.empty{border:1px dashed #484957;border-radius:10px;padding:28px}.dialog{max-width:500px;background:#20212a;color:white;border:1px solid #505360;border-radius:12px;padding:28px}.dialog::backdrop{background:#000a}.actions{display:flex;gap:12px;justify-content:flex-end}.secondary{background:#3d3f49;color:white}footer{margin-top:28px;color:#90929e;font-size:13px} @media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:29px}.toolbar,header{flex-wrap:wrap}.order-head{flex-direction:column}}
.logo img{display:block;width:190px;height:auto}.badge{align-self:flex-start;background:#ff6b2b14;color:#ffae8c;border:1px solid #ff6b2b45}.order-head{align-items:center}.order-head .badge{align-self:center}.card,.order{background:linear-gradient(140deg,#221a2c60,#14131b 65%)}.art{border:1px solid #ffffff12}.dialog{background:#14141b}.status{color:#ffae8c}button:hover:not(:disabled){background:#ff8654}a{color:#ded8e7}header{background:#0b0c10ed}header a:hover{color:#ff8654}</style>
<header><a class="logo" href="/" aria-label="NovaNoxX 격리 테스트 홈"><img src="/assets/novanoxx-brand-logo.png" alt="NovaNoxX"></a><span class="badge">격리 테스트</span><a href="#orders">구매 주문 내역 ↓</a></header>
<main><h1>에셋을 선택하고 구매를 확인하세요.</h1><p class="notice">가상 NEON과 테스트 파일로 구매를 검증합니다. 실제 돈이 청구되지 않으며 운영 원본과 기존 주문에는 영향을 주지 않습니다.</p><div class="toolbar"><label>테스트 구매자 <select id="buyer"><option value="buyer-a">구매자 A</option><option value="buyer-b">구매자 B</option></select></label><div>테스트 잔액 <strong id="balance" class="balance">확인 중</strong></div></div><p id="message" class="status" role="status" aria-live="polite"></p><section aria-label="구매 가능한 에셋"><div id="catalog" class="grid"></div></section><section id="orders"><h2>구매 주문 내역</h2><p>주문 완료와 약정 파일 권한, 정산 대기 상태를 확인하실 수 있습니다.</p><div id="order-list"></div></section><footer>1 NEON = 100원 · 총 수수료 12% (PG·수수료 부가세 포함) · 추가 작업 없는 구매만 지원합니다.</footer></main>
<dialog id="confirm" class="dialog"><h2>테스트 구매 확인</h2><div id="confirmation"></div><p>테스트용 거래 조건입니다. 실제 계약 동의나 결제를 진행하지 않습니다.</p><div class="actions"><button id="cancel" class="secondary">취소</button><button id="buy">테스트 구매하기</button></div></dialog><script src="/app.js"></script></html>
